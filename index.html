// ============================================================

// Seeded, emotion-driven, six-world procedural music engine.

// Every idea is reproducible from its seed. Evolve preserves

// and bass around the same musical seed of an idea.

// ---------- Seeded RNG ----------
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function randomSeed(){ return Math.floor(Math.random()*4294967296) >>> 0; }
function randRange(rng,min,max){ return min + rng()*(max-min); }
function randInt(rng,min,max){ return Math.floor(randRange(rng,min,max+1)); }
function pick(rng,arr){ return arr[Math.floor(rng()*arr.length)]; }
function humanizeTime(rng,t){ return t + (rng()*0.014 - 0.007); }
function humanizeVel(rng,v){ return Math.max(0.05, Math.min(1, v + (rng()*0.18 - 0.09))); }

// ---------- Music theory ----------
const SCALES = {
  major:          [0,2,4,5,7,9,11],
  minor:          [0,2,3,5,7,8,10],
  dorian:         [0,2,3,5,7,9,10],
  mixolydian:     [0,2,4,5,7,9,10],
  phrygian:       [0,1,3,5,7,8,10],
  lydian:         [0,2,4,6,7,9,11],
  harmonicMinor:  [0,2,3,5,7,8,11],
  melodicMinor:   [0,2,3,5,7,9,11],
};

function midiToFreq(m){ return 440 * Math.pow(2, (m-69)/12); }

function scaleDegreeToSemitone(scaleArr, degreeIndex){
  const octave = Math.floor(degreeIndex/7);
  const idx = ((degreeIndex % 7) + 7) % 7;
  return scaleArr[idx] + 12*octave;
}

function chordFromDegree(rootMidi, scaleArr, degree, size){
  size = size || 4;
  const tones = [];
  for(let i=0;i<size;i++) tones.push(degree + i*2);
  return tones.map(t => rootMidi + scaleDegreeToSemitone(scaleArr, t));
}

function voiceLead(newChord, prevChord){
  if(!prevChord) return newChord.slice();
  return newChord.map((n,i)=>{
    let note = n;
    const target = prevChord[i] !== undefined ? prevChord[i] : prevChord[0];
    while(note - target > 6) note -= 12;
    while(target - note > 6) note += 12;
    return note;
  });
}

function generateProgression(rootMidi, scaleArr, degrees, chordSize){
  let prev = null;
  return degrees.map(deg => {
    const chord = chordFromDegree(rootMidi, scaleArr, deg, chordSize);
    const voiced = voiceLead(chord, prev);
    prev = voiced;
    return { degree: deg, notes: voiced };
  });
}

};

// ---------- Motif-based melody (replaces pure per-step randomness) ----------
function generateMotif(rng, emotion){
  const len = randInt(rng,3,6);
  const cell = [];
  let deg = 0;
  const usedSteps = new Set();
  for(let i=0;i<len;i++){
    let step = randInt(rng,0,7), guard=0;
    while(usedSteps.has(step) && guard<8){ step=(step+1)%8; guard++; }
    usedSteps.add(step);
    if(i>0){ const move = pick(rng,[-2,-1,-1,0,1,1,2]); deg += move; }
    cell.push({ step, deg, longer: rng() < Math.min(0.55, 0.22*emotion.noteLenMul) });
  }
  cell.sort((a,b)=>a.step-b.step);
  return cell;
}

function varyMotif(rng, motif, emotion){
  return motif.map(n=>{
    const c = { step:n.step, deg:n.deg, longer:n.longer };
    if(rng() < 0.40) c.deg += pick(rng,[-1,0,0,1]);
    if(rng() < 0.25) c.step = Math.max(0, Math.min(7, c.step + pick(rng,[-1,1])));
    if(rng() < 0.20) c.longer = !c.longer;
    return c;
  });
}

function generateMelodyFromMotif(rng, motif, genre, emotion, scaleArr, rootMidi, progression, barDur, swing){
  const events = [];
  const stepsPerBar = 8;
  const stepDur = barDur/stepsPerBar;
  const leadOct = genre.octaves.lead;
  let activeMotif = motif;
  progression.forEach((chord, barIdx)=>{
    if(rng() < emotion.restProb*0.6) return; // phrase breathing: whole-bar rest
    if(rng() < emotion.motifVaryProb) activeMotif = varyMotif(rng, activeMotif, emotion);
    const density = Math.min(1, 0.55*emotion.densityMul);
    activeMotif.forEach(note=>{
      if(rng() > density) return;
      let start = barIdx*barDur + note.step*stepDur;
      if(note.step % 2 === 1) start += swing*stepDur;
      const degreeIndex = chord.degree + note.deg;
      const pitch = rootMidi + scaleDegreeToSemitone(scaleArr, degreeIndex) + leadOct;
      const dur = stepDur * (note.longer ? 1.8*emotion.noteLenMul : 0.9*emotion.noteLenMul);
      const vel = Math.max(0.05, Math.min(1, emotion.velBase + (rng()*2-1)*emotion.velRange));
      events.push({ time: humanizeTime(rng,start), freq: midiToFreq(pitch), dur, vel: humanizeVel(rng,vel) });
    });
  });
  return events;
}

// ---------- Genre-specific bass patterns ----------
function generateBass(rng, genre, emotion, progression, barDur, swing, rootMidi){
  const events = [];
  const bassOct = genre.octaves.bass;
  const beatDur = barDur/4;
  const baseVel = Math.min(1, 0.72*(emotion.densityMul*0.6+0.4));
  progression.forEach((chord, barIdx)=>{
    const root = chord.notes[0] + bassOct;
    const third = chord.notes[1]!==undefined ? chord.notes[1]+bassOct : root+4;
    const fifth = chord.notes[2]!==undefined ? chord.notes[2]+bassOct : root+7;
    const t0 = barIdx*barDur;
    function addNote(beatPos, pitch, lenBeats, vel){
      let start = t0 + beatPos*beatDur;
      if(Math.round(beatPos*2)%2===1) start += swing*beatDur;
      events.push({ time:humanizeTime(rng,start), freq:midiToFreq(pitch), dur:beatDur*lenBeats, vel:humanizeVel(rng,vel) });
    }
    switch(genre.bassStyle){
      case 'sustained-root-fifth':
        addNote(0, root, 1.9, baseVel);
        if(rng()<0.5) addNote(2, fifth, 1.8, baseVel*0.85);
        break;
      case 'walking':
      case 'walking-lite':
        addNote(0, root, 0.9, baseVel);
        addNote(1, third, 0.85, baseVel*0.85);
        addNote(2, fifth, 0.85, baseVel*0.85);
        if(genre.bassStyle==='walking' || rng()<0.6) addNote(3, root+(rng()<0.5?2:-1), 0.85, baseVel*0.8);
        break;
      case 'sparse-sub':
        addNote(0, root, 2.6, baseVel*1.1);
        if(rng()<0.3) addNote(2.5, root, 1.0, baseVel*0.7);
        break;
      case 'vinyl-groove':
        addNote(0, root, 0.5, baseVel);
        if(rng()<0.7) addNote(0.75, root, 0.3, baseVel*0.6);
        addNote(1.5, fifth, 0.45, baseVel*0.8);
        if(rng()<0.5) addNote(2.5, root, 0.4, baseVel*0.7);
        if(rng()<0.4) addNote(3.5, third, 0.4, baseVel*0.65);
        break;
      case 'driving-pulse':
        for(let b=0;b<4;b++){ if(rng()<0.9) addNote(b, b%2===0?root:fifth, 0.45, baseVel*(b===0?1:0.8)); }
        break;
      default:
        addNote(0, root, 1.8, baseVel);
    }
  });
  return events;
}

// ---------- Idea generation & evolution ----------
function generateIdea(seed, lockedGenreKey){
  const rng = mulberry32(seed);
  const genreKeys = Object.keys(GENRES);
  const genreKey = lockedGenreKey || pick(rng, genreKeys);
  const genre = GENRES[genreKey];
  const emoPool = (rng() < 0.85) ? genre.moods : Object.keys(EMOTIONS);
  const emotionKey = pick(rng, emoPool);
  const emotion = EMOTIONS[emotionKey];
  const scaleKey = pick(rng, genre.scales);
  const scaleArr = SCALES[scaleKey];
  const rootMidi = randInt(rng, genre.rootRange[0], genre.rootRange[1]);
  let tempo = Math.round(randRange(rng, genre.tempoRange[0], genre.tempoRange[1]) + emotion.tempoBias);
  tempo = Math.max(56, Math.min(128, tempo));
  const barDur = 60/tempo*4;
  const chordSize = randInt(rng, genre.chordSizeRange[0], genre.chordSizeRange[1]);
  const degrees = pick(rng, genre.progressions);
  const progression = generateProgression(rootMidi, scaleArr, degrees, chordSize);
  const swing = randRange(rng, genre.swingRange[0], genre.swingRange[1]) * emotion.swingMul;
  const motif = generateMotif(rng, emotion);
  const melodyEvents = generateMelodyFromMotif(rng, motif, genre, emotion, scaleArr, rootMidi, progression, barDur, swing);
  const bassEvents = generateBass(rng, genre, emotion, progression, barDur, swing, rootMidi);
  return {
    seed, genreKey, emotionKey, scaleKey, rootMidi, tempo, barDur,
    loopDur: barDur*progression.length, progression, melodyEvents, bassEvents,
    motif, swing, chordSize, evolveGen:0,
  };
}

// "Evolve" keeps genre + emotion + scale + root + tempo + harmony identical
// (the bulk of the musical identity) and regenerates melody/bass from a
// related seed, so ~70-90% of the idea's identity is preserved while new
// development is introduced — the listener hears the same story continue.
function evolveIdea(idea){
  const newSeed = ((idea.seed>>>0) + 0x9E3779B1*((idea.evolveGen||0)+1)) >>> 0;
  const rng = mulberry32(newSeed);
  const genre = GENRES[idea.genreKey];
  const emotion = EMOTIONS[idea.emotionKey];
  const scaleArr = SCALES[idea.scaleKey];
  const motif = varyMotif(rng, idea.motif, emotion);
  const melodyEvents = generateMelodyFromMotif(rng, motif, genre, emotion, scaleArr, idea.rootMidi, idea.progression, idea.barDur, idea.swing);
  const bassEvents = generateBass(rng, genre, emotion, idea.progression, idea.barDur, idea.swing, idea.rootMidi);
  return Object.assign({}, idea, {
    seed:newSeed, motif, melodyEvents, bassEvents,
    evolveGen:(idea.evolveGen||0)+1, evolvedFrom: idea.seed,
  });
}

// ---------- Synth "voices" (timbre layer — genre-distinct instrument character) ----------
const PAD_VOICES = {
  'sine-tri-mix': { oscs:[{type:'sine',detune:-0.05},{type:'triangle',detune:0},{type:'sine',detune:0.06}], attack:0.12, release:0.7 },
  'rhodes':       { oscs:[{type:'sine',detune:0},{type:'triangle',detune:0.02},{type:'sine',detune:-0.03,octave:1}], attack:0.05, release:0.9 },
  'bell-pad':     { oscs:[{type:'sine',detune:0},{type:'sine',detune:0.01,octave:1},{type:'triangle',detune:-0.02,octave:2}], attack:0.02, release:1.4 },
  'warm-keys':    { oscs:[{type:'triangle',detune:0},{type:'sine',detune:0.03}], attack:0.03, release:0.6 },
  'supersaw':     { oscs:[{type:'sawtooth',detune:-0.09},{type:'sawtooth',detune:-0.03},{type:'sawtooth',detune:0},{type:'sawtooth',detune:0.03},{type:'sawtooth',detune:0.09}], attack:0.08, release:0.5 },
  'jazz-keys':    { oscs:[{type:'triangle',detune:-0.04},{type:'sine',detune:0},{type:'triangle',detune:0.05,octave:1}], attack:0.04, release:0.8 },
};
const LEAD_VOICES = {
  'sine':          { type:'sine' },
  'rhodes-lead':   { type:'triangle' },
  'bell':          { type:'sine', harmonic:3 },
  'jazzy-piano':   { type:'triangle' },
  'bright-lead':   { type:'sawtooth' },
  'sax-ish':       { type:'sawtooth' },
};
const BASS_VOICES = {
  'sine-sub':        { main:'sine',     sub:true },
  'triangle-sub':    { main:'triangle', sub:true },
  'sine-sub-deep':   { main:'sine',     sub:true, subOct:-24 },
  'triangle-punchy': { main:'triangle', sub:false },
  'triangle-tight':  { main:'triangle', sub:false },
  'upright-ish':     { main:'triangle', sub:true, soft:true },
};

function effectiveTimbre(genre, emotion){
  return {
    padType: genre.timbre.padType, leadType: genre.timbre.leadType, bassType: genre.timbre.bassType,
    padCutoff: genre.timbre.padCutoff*emotion.filterMul,
    leadCutoff: genre.timbre.leadCutoff*emotion.filterMul,
    leadVibrato: genre.timbre.leadVibrato,
    bassCutoff: genre.timbre.bassCutoff*Math.min(1.15, emotion.filterMul),
  };
}

function synthPad(ctx, dest, freq, time, dur, vel, timbre){
  const voice = PAD_VOICES[timbre.padType] || PAD_VOICES['sine-tri-mix'];
  const g = ctx.createGain();
  const filt = ctx.createBiquadFilter();
  filt.type='lowpass'; filt.frequency.value = timbre.padCutoff||1300; filt.Q.value = 0.6;
  g.gain.setValueAtTime(0.0001, time);
  g.gain.exponentialRampToValueAtTime(Math.max(0.02, vel*0.22), time+(voice.attack||0.08));
  g.gain.exponentialRampToValueAtTime(0.0001, time+dur+(voice.release||0.6));
  const stopT = time+dur+(voice.release||0.6)+0.1;
  voice.oscs.forEach(o=>{
    const osc = ctx.createOscillator();
    osc.type = o.type;
    osc.frequency.value = freq * Math.pow(2,(o.detune||0)/12) * Math.pow(2,(o.octave||0));
    osc.connect(filt);
    osc.start(time); osc.stop(stopT);
  });
  filt.connect(g); g.connect(dest);
}

function synthLead(ctx, dest, freq, time, dur, vel, timbre){
  const voice = LEAD_VOICES[timbre.leadType] || LEAD_VOICES['sine'];
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  const filt = ctx.createBiquadFilter();
  filt.type='lowpass'; filt.frequency.value = timbre.leadCutoff||2400;
  o.type = voice.type; o.frequency.value = freq;
  let harmOsc = null;
  if(voice.harmonic){
    harmOsc = ctx.createOscillator(); harmOsc.type='sine';
    harmOsc.frequency.value = freq*voice.harmonic;
    const harmGain = ctx.createGain(); harmGain.gain.value = 0.18;
    harmOsc.connect(harmGain); harmGain.connect(filt);
  }
  let lfo=null, lfoGain=null;
  if(timbre.leadVibrato > 0){
    lfo = ctx.createOscillator(); lfo.frequency.value = timbre.leadVibrato;
    lfoGain = ctx.createGain(); lfoGain.gain.value = freq*0.004;
    lfo.connect(lfoGain); lfoGain.connect(o.frequency);
  }
  g.gain.setValueAtTime(0.0001, time);
  g.gain.exponentialRampToValueAtTime(Math.max(0.02, vel*0.2), time+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, time+dur+0.18);
  o.connect(filt); filt.connect(g); g.connect(dest);
  const stopT = time+dur+0.22;
  o.start(time); o.stop(stopT);
  if(lfo){ lfo.start(time); lfo.stop(stopT); }
  if(harmOsc){ harmOsc.start(time); harmOsc.stop(stopT); }
}

function synthBass(ctx, dest, freq, time, dur, vel, timbre){
  const voice = BASS_VOICES[timbre.bassType] || BASS_VOICES['sine-sub'];
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  const filt = ctx.createBiquadFilter();
  filt.type='lowpass'; filt.frequency.value = timbre.bassCutoff||700; filt.Q.value = voice.soft ? 0.3 : 0.7;
  o.type = voice.main; o.frequency.value = freq;
  o.connect(filt);
  let sub = null;
  if(voice.sub){
    sub = ctx.createOscillator(); sub.type='sine';
    sub.frequency.value = freq*Math.pow(2, (voice.subOct||-12)/12);
    sub.connect(filt);
  }
  g.gain.setValueAtTime(0.0001, time);
  g.gain.exponentialRampToValueAtTime(Math.max(0.03, vel*0.45), time+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, time+dur+0.12);
  filt.connect(g); g.connect(dest);
  const stopT = time+dur+0.16;
  o.start(time); o.stop(stopT);
  if(sub){ sub.start(time); sub.stop(stopT); }
}

// ---------- App state ----------
let audioCtx = null, masterGain, analyser;
let lockedGenreKey = null;
let idea = null;
let isPlaying = false;
let schedulerTimer = null, nextLoopBoundary = 0;
let discoveryCount = 1;
let history = [];
let historyIdx = -1;

function ensureAudio(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain(); masterGain.gain.value = 0.9;
  analyser = audioCtx.createAnalyser(); analyser.fftSize = 512;
  masterGain.connect(analyser); analyser.connect(audioCtx.destination);
}

function pushHistory(newIdea){
  history = history.slice(0, historyIdx+1);
  history.push(newIdea);
  historyIdx = history.length-1;
  discoveryCount++;
}

function applyIdea(newIdea){
  idea = newIdea;
  renderGenreChips();
  updateEmotionBadge();
  updateOdometer();
  const seedInput = document.getElementById('seedInput');
  if(seedInput) seedInput.value = idea.seed;
}

function restoreIdeaAt(idx){
  historyIdx = idx;
  idea = history[idx];
  renderGenreChips();
  updateEmotionBadge();
  updateOdometer();
  document.getElementById('seedInput').value = idea.seed;
}

function buildNewIdea(){
  const seed = randomSeed();
  const newIdea = generateIdea(seed, lockedGenreKey);
  pushHistory(newIdea);
  applyIdea(newIdea);
}

function evolveClicked(){
  if(!idea){ buildNewIdea(); return; }
  const newIdea = evolveIdea(idea);
  pushHistory(newIdea);
  applyIdea(newIdea);
}

function nextIdea(){
  if(historyIdx < history.length-1){ restoreIdeaAt(historyIdx+1); }
  else { buildNewIdea(); }
}
function prevIdea(){
  if(historyIdx > 0) restoreIdeaAt(historyIdx-1);
}

function loadSeedFromInput(){
  const raw = document.getElementById('seedInput').value.trim();
  const n = parseInt(raw, 10);
  if(!Number.isFinite(n) || n < 0) return;
  const seed = (n >>> 0);
  ensureAudio();
  const newIdea = generateIdea(seed, lockedGenreKey);
  pushHistory(newIdea);
  applyIdea(newIdea);
  if(!isPlaying) startPlayback();
}

// ---------- Scheduling ----------
function scheduleLoopAt(startTime){
  const genre = GENRES[idea.genreKey];
  const emotion = EMOTIONS[idea.emotionKey];
  const timbre = effectiveTimbre(genre, emotion);
  idea.progression.forEach((chord,i)=>{
    const t = startTime + i*idea.barDur;
    chord.notes.map(n=>midiToFreq(n+genre.octaves.chord)).forEach(f=>synthPad(audioCtx, masterGain, f, t, idea.barDur*0.95, 0.6, timbre));
  });
  idea.melodyEvents.forEach(ev => synthLead(audioCtx, masterGain, ev.freq, startTime+ev.time, ev.dur, ev.vel, timbre));
  idea.bassEvents.forEach(ev => synthBass(audioCtx, masterGain, ev.freq, startTime+ev.time, ev.dur, ev.vel, timbre));
}
function schedulerTick(){
  if(!isPlaying) return;
  const now = audioCtx.currentTime;
  if(nextLoopBoundary - now < 0.2){
    scheduleLoopAt(nextLoopBoundary);
    nextLoopBoundary += idea.loopDur;
  }
}
function startPlayback(){
  ensureAudio();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  if(!idea) buildNewIdea();
  isPlaying = true;
  nextLoopBoundary = audioCtx.currentTime + 0.05;
  schedulerTimer = setInterval(schedulerTick, 50);
  document.getElementById('btnPlay').textContent = 'Stop';
}
function stopPlayback(){
  isPlaying = false;
  clearInterval(schedulerTimer);
  document.getElementById('btnPlay').textContent = 'Play';
}

// ---------- The Globe: full-screen, audio-reactive, tap-to-discover, per-world visual identity ----------
let globeStarted = false;
let rotY = 0.4, rotX = 0.35;
let autoSpin = 0.0022;
let dragging = false, lastPX=0, dragVX=0;
let nodePoints = [];
let flashT = 0;
let timeData = null;

function fibonacciSphere(n){
  const pts=[];
  const offset = 2/n;
  const increment = Math.PI*(3-Math.sqrt(5));
  for(let i=0;i<n;i++){
    const y = ((i*offset)-1)+(offset/2);
    const r = Math.sqrt(Math.max(0,1-y*y));
    const phi = i*increment;
    pts.push({ x:Math.cos(phi)*r, y:y, z:Math.sin(phi)*r });
  }
  return pts;
}

function rotatePoint(p, rx, ry){
  let y = p.y*Math.cos(rx) - p.z*Math.sin(rx);
  let z = p.y*Math.sin(rx) + p.z*Math.cos(rx);
  let x = p.x;
  const x2 = x*Math.cos(ry) + z*Math.sin(ry);
  const z2 = -x*Math.sin(ry) + z*Math.cos(ry);
  return { x:x2, y:y, z:z2 };
}

function audioEnergy(){
  if(!analyser) return 0;
  if(!timeData) timeData = new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(timeData);
  let sum=0;
  for(let i=0;i<timeData.length;i++){ const v=(timeData[i]-128)/128; sum += v*v; }
  return Math.sqrt(sum/timeData.length);
}

function startGlobe(){
  if(globeStarted) return;
  globeStarted = true;
  nodePoints = fibonacciSphere(260);

  const canvas = document.getElementById('globeStage');
  const ctx2d = canvas.getContext('2d');
  function resize(){ canvas.width = window.innerWidth*devicePixelRatio; canvas.height = window.innerHeight*devicePixelRatio; }
  resize(); window.addEventListener('resize', resize);

  function frame(){
    requestAnimationFrame(frame);
    const w = canvas.width, h = canvas.height;
    const cx = w/2, cy = h/2;
    const R = Math.min(w,h)*0.4;
    const visual = GENRES[idea ? idea.genreKey : 'oasis-fallback'] ? GENRES[idea.genreKey].visual : { accent:'#D4AF37', accent2:'#8a8580', glow:0.5, pulseSpeed:1, bg:'#000' };
    const accent = visual.accent, accent2 = visual.accent2;

    ctx2d.fillStyle = visual.bg || '#000';
    ctx2d.fillRect(0,0,w,h);

    const grad = ctx2d.createRadialGradient(cx,cy,R*0.1,cx,cy,R*1.6);
    grad.addColorStop(0, accent+'2e');
    grad.addColorStop(0.6, accent2+'14');
    grad.addColorStop(1, '#00000000');
    ctx2d.fillStyle = grad;
    ctx2d.fillRect(0,0,w,h);

    const energy = (audioCtx && isPlaying) ? audioEnergy() : 0.04;

    const spinRate = autoSpin * (visual.pulseSpeed||1);
    if(!dragging){ rotY += spinRate + dragVX*0.02; dragVX *= 0.92; }
    else { rotY += dragVX; }

    ctx2d.lineWidth = Math.max(1, devicePixelRatio*0.7);
    ctx2d.strokeStyle = accent + '30';
    for(let lat=-60; lat<=60; lat+=30){
      ctx2d.beginPath();
      for(let lon=0; lon<=360; lon+=6){
        const rad = lat*Math.PI/180, lonr = lon*Math.PI/180;
        const p = { x:Math.cos(rad)*Math.cos(lonr), y:Math.sin(rad), z:Math.cos(rad)*Math.sin(lonr) };
        const rp = rotatePoint(p, rotX, rotY);
        const px = cx + rp.x*R, py = cy + rp.y*R*0.95;
        if(lon===0) ctx2d.moveTo(px,py); else ctx2d.lineTo(px,py);
      }
      ctx2d.stroke();
    }
    for(let lon=0; lon<360; lon+=30){
      ctx2d.beginPath();
      for(let lat=-90; lat<=90; lat+=6){
        const rad = lat*Math.PI/180, lonr = lon*Math.PI/180;
        const p = { x:Math.cos(rad)*Math.cos(lonr), y:Math.sin(rad), z:Math.cos(rad)*Math.sin(lonr) };
        const rp = rotatePoint(p, rotX, rotY);
        const px = cx + rp.x*R, py = cy + rp.y*R*0.95;
        if(lat===-90) ctx2d.moveTo(px,py); else ctx2d.lineTo(px,py);
      }
      ctx2d.stroke();
    }

    const projected = nodePoints.map((p,i)=>{
      const rp = rotatePoint(p, rotX, rotY);
      const depth = (rp.z+1.3)/2.3;
      return { x: cx + rp.x*R, y: cy + rp.y*R*0.95, depth, alt: i%3===0 };
    }).sort((a,b)=>a.depth-b.depth);

    const glowMul = 0.6 + (visual.glow||0.5);
    projected.forEach(n=>{
      const pulse = 1 + energy*1.8*glowMul*n.depth;
      const size = (0.8 + n.depth*2.4) * pulse * devicePixelRatio;
      const alpha = (0.15 + n.depth*0.85) * (0.6+energy*0.4);
      ctx2d.beginPath();
      ctx2d.arc(n.x, n.y, Math.max(0.4,size), 0, Math.PI*2);
      ctx2d.fillStyle = n.alt ? accent2 : accent;
      ctx2d.globalAlpha = Math.min(1,alpha);
      ctx2d.fill();
    });
    ctx2d.globalAlpha = 1;

    if(flashT > 0){
      ctx2d.fillStyle = accent + '38';
      ctx2d.globalAlpha = flashT*0.6;
      ctx2d.fillRect(0,0,w,h);
      ctx2d.globalAlpha = 1;
      flashT -= 0.04;
    }
  }
  requestAnimationFrame(frame);

  let downX=0, downY=0, moved=false;
  canvas.addEventListener('pointerdown', e=>{ dragging=true; moved=false; lastPX=e.clientX; downX=e.clientX; downY=e.clientY; });
  canvas.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const dx = e.clientX - lastPX;
    if(Math.abs(e.clientX-downX)>4 || Math.abs(e.clientY-downY)>4) moved=true;
    dragVX = dx*0.003; lastPX = e.clientX;
  });
  window.addEventListener('pointerup', ()=>{
    if(!dragging) return;
    dragging = false;
    if(!moved){
      ensureAudio(); nextIdea(); flashT = 1;
      if(!isPlaying) startPlayback();
    }
  });
}

// ---------- Export: WAV ----------
function encodeWav(audioBuffer){
  const numCh = audioBuffer.numberOfChannels;
  const len = audioBuffer.length * numCh * 2 + 44;
  const buf = new ArrayBuffer(len);
  const view = new DataView(buf);
  function writeStr(off, s){ for(let i=0;i<s.length;i++) view.setUint8(off+i, s.charCodeAt(i)); }
  writeStr(0,'RIFF'); view.setUint32(4, len-8, true); writeStr(8,'WAVE');
  writeStr(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true);
  view.setUint16(22,numCh,true); view.setUint32(24,audioBuffer.sampleRate,true);
  view.setUint32(28,audioBuffer.sampleRate*numCh*2,true); view.setUint16(32,numCh*2,true); view.setUint16(34,16,true);
  writeStr(36,'data'); view.setUint32(40, audioBuffer.length*numCh*2, true);
  let offset=44;
  const chans=[]; for(let c=0;c<numCh;c++) chans.push(audioBuffer.getChannelData(c));
  for(let i=0;i<audioBuffer.length;i++){
    for(let c=0;c<numCh;c++){
      let s = Math.max(-1, Math.min(1, chans[c][i]));
      view.setInt16(offset, s<0? s*0x8000 : s*0x7FFF, true);
      offset+=2;
    }
  }
  return new Blob([view], { type:'audio/wav' });
}

async function renderMixOffline(parts){
  const OfflineCtx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const sr = 44100;
  const dur = idea.loopDur + 1.0;
  const off = new OfflineCtx(2, Math.ceil(dur*sr), sr);
  const gain = off.createGain(); gain.gain.value = 0.9; gain.connect(off.destination);
  const genre = GENRES[idea.genreKey];
  const emotion = EMOTIONS[idea.emotionKey];
  const timbre = effectiveTimbre(genre, emotion);
  if(parts.includes('chords')){
    idea.progression.forEach((chord,i)=>{
      const t = i*idea.barDur;
      chord.notes.map(n=>midiToFreq(n+genre.octaves.chord)).forEach(f=>synthPad(off, gain, f, t, idea.barDur*0.95, 0.6, timbre));
    });
  }
  if(parts.includes('melody')) idea.melodyEvents.forEach(ev=>synthLead(off, gain, ev.freq, ev.time, ev.dur, ev.vel, timbre));
  if(parts.includes('bass')) idea.bassEvents.forEach(ev=>synthBass(off, gain, ev.freq, ev.time, ev.dur, ev.vel, timbre));
  return off.startRendering();
}

function fileTag(){ return `${idea.genreKey}-${idea.emotionKey}-seed${idea.seed}-${idea.tempo}bpm`; }

async function exportWav(){
  if(!idea) buildNewIdea();
  const rendered = await renderMixOffline(['chords','melody','bass']);
  downloadBlob(encodeWav(rendered), `frequency-oasis-${fileTag()}.wav`);
}
async function exportStems(){
  if(!idea) buildNewIdea();
  downloadBlob(encodeWav(await renderMixOffline(['chords'])), `frequency-oasis-${fileTag()}-chords.wav`);
  downloadBlob(encodeWav(await renderMixOffline(['melody'])), `frequency-oasis-${fileTag()}-melody.wav`);
  downloadBlob(encodeWav(await renderMixOffline(['bass'])), `frequency-oasis-${fileTag()}-bass.wav`);
}

// ---------- Export: MIDI ----------
function writeVarLen(value){
  let buffer = value & 0x7F;
  const bytes = [];
  while ((value >>= 7)) buffer = (buffer<<8) | ((value&0x7F)|0x80);
  while(true){ bytes.push(buffer & 0xFF); if(buffer & 0x80) buffer >>=8; else break; }
  return bytes;
}
function freqToMidi(f){ return Math.round(69 + 12*Math.log2(f/440)); }

function buildMidiTrack(events, ppq, bpm){
  const secToTick = (s)=> Math.round(s * (ppq * (bpm/60)));
  const noteEvents = [];
  events.forEach(ev=>{
    const midi = Math.max(0, Math.min(127, freqToMidi(ev.freq)));
    const vel = Math.max(1, Math.min(127, Math.round(ev.vel*127)));
    noteEvents.push({ tick:secToTick(ev.time), type:'on', note:midi, vel });
    noteEvents.push({ tick:secToTick(ev.time+ev.dur), type:'off', note:midi, vel:0 });
  });
  noteEvents.sort((a,b)=> a.tick - b.tick);
  const bytes = [];
  let lastTick = 0;
  noteEvents.forEach(ne=>{
    const delta = Math.max(0, ne.tick - lastTick);
    bytes.push(...writeVarLen(delta));
    bytes.push(ne.type==='on' ? 0x90 : 0x80, ne.note, ne.vel);
    lastTick = ne.tick;
  });
  bytes.push(...writeVarLen(0), 0xFF, 0x2F, 0x00);
  const header = [0x4D,0x54,0x72,0x6B, ...int32(bytes.length)];
  return [...header, ...bytes];
}
function int32(n){ return [(n>>24)&0xFF,(n>>16)&0xFF,(n>>8)&0xFF,n&0xFF]; }
function int16(n){ return [(n>>8)&0xFF, n&0xFF]; }

function exportMidi(){
  if(!idea) buildNewIdea();
  const genre = GENRES[idea.genreKey];
  const ppq = 480;
  const chordEvents = [];
  idea.progression.forEach((chord,i)=>{
    const t = i*idea.barDur;
    chord.notes.forEach(n=>{
      chordEvents.push({ time:t, dur:idea.barDur*0.95, freq:midiToFreq(n+genre.octaves.chord), vel:0.6 });
    });
  });
  const track1 = buildMidiTrack(chordEvents, ppq, idea.tempo);
  const track2 = buildMidiTrack(idea.melodyEvents, ppq, idea.tempo);
  const track3 = buildMidiTrack(idea.bassEvents, ppq, idea.tempo);
  const headerChunk = [0x4D,0x54,0x68,0x64, ...int32(6), ...int16(1), ...int16(3), ...int16(ppq)];
  const all = new Uint8Array([...headerChunk, ...track1, ...track2, ...track3]);
  downloadBlob(new Blob([all], { type:'audio/midi' }), `frequency-oasis-${fileTag()}.mid`);
}

function exportSeed(){
  if(!idea) buildNewIdea();
  const payload = {
    seed: idea.seed, genre: idea.genreKey, emotion: idea.emotionKey, scale: idea.scaleKey,
    rootMidi: idea.rootMidi, tempo: idea.tempo, chordSize: idea.chordSize,
    swing: Number(idea.swing.toFixed(3)), evolveGen: idea.evolveGen||0,
    evolvedFrom: idea.evolvedFrom || null,
  };
  const blob = new Blob([JSON.stringify(payload,null,2)], { type:'application/json' });
  downloadBlob(blob, `frequency-oasis-seed-${idea.seed}.json`);
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

// ---------- UI wiring ----------
function updateEmotionBadge(){
  const genre = GENRES[idea.genreKey];
  const emotion = EMOTIONS[idea.emotionKey];
  document.getElementById('emotionWord').textContent = emotion.label;
  document.getElementById('emotionSub').textContent = `${genre.label} · ${idea.tempo} bpm · ${idea.scaleKey}`;
}
function updateOdometer(){
  document.getElementById('odometer').innerHTML =
    `Discovery <b>${discoveryCount.toLocaleString()}</b> · Seed <b>${idea.seed}</b> of <b>4,294,967,296</b> possible worlds`;
}
function renderGenreChips(){
  const wrap = document.getElementById('genreSelect');
  wrap.innerHTML = '';
  const allChip = document.createElement('button');
  allChip.className = 'chip' + (!lockedGenreKey ? ' active' : '');
  allChip.textContent = 'All Worlds';
  allChip.onclick = ()=>{ lockedGenreKey = null; ensureAudio(); buildNewIdea(); if(!isPlaying) startPlayback(); };
  wrap.appendChild(allChip);
  Object.keys(GENRES).forEach(key=>{
    const g = GENRES[key];
    const chip = document.createElement('button');
    chip.className = 'chip' + (lockedGenreKey===key ? ' active' : '');
    chip.innerHTML = `<span class="dot" style="background:${g.visual.accent}"></span>${g.label}`;
    chip.onclick = ()=>{ lockedGenreKey = key; ensureAudio(); buildNewIdea(); if(!isPlaying) startPlayback(); };
    wrap.appendChild(chip);
  });
}

document.getElementById('btnPlay').onclick = ()=>{ if(isPlaying) stopPlayback(); else startPlayback(); };
document.getElementById('btnNext').onclick = ()=>{ ensureAudio(); nextIdea(); if(!isPlaying) startPlayback(); };
document.getElementById('btnPrev').onclick = ()=>{ ensureAudio(); prevIdea(); };
document.getElementById('btnEvolve').onclick = ()=>{ ensureAudio(); evolveClicked(); if(!isPlaying) startPlayback(); };
document.getElementById('btnLoadSeed').onclick = ()=> loadSeedFromInput();
document.getElementById('seedInput').addEventListener('keydown', e=>{ if(e.key==='Enter') loadSeedFromInput(); });
document.getElementById('btnExportToggle').onclick = ()=>{ document.getElementById('exportPanel').classList.toggle('open'); };
document.getElementById('btnExportWav').onclick = ()=>{ ensureAudio(); exportWav(); };
document.getElementById('btnExportStems').onclick = ()=>{ ensureAudio(); exportStems(); };
document.getElementById('btnExportMidi').onclick = ()=>{ ensureAudio(); exportMidi(); };
document.getElementById('btnExportSeed').onclick = ()=>{ ensureAudio(); exportSeed(); };

// ---------- Init ----------
idea = generateIdea(randomSeed(), null);
history = [idea]; historyIdx = 0; discoveryCount = 1;
renderGenreChips();
updateEmotionBadge();
updateOdometer();
document.getElementById('seedInput').value = idea.seed;
startGlobe(); // globe renders immediately (idle ambient state); audio starts on first interaction
</script>
