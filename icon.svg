<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD966"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- globe meridians -->
  <g fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.55">
    <circle cx="256" cy="256" r="150"/>
    <ellipse cx="256" cy="256" rx="150" ry="60"/>
    <ellipse cx="256" cy="256" rx="60" ry="150"/>
  </g>

  <!-- soundwave arcs across the globe -->
  <g fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round">
    <path d="M 146 256 Q 201 176 256 256 Q 311 336 366 256"/>
  </g>

  <!-- core dot -->
  <circle cx="256" cy="256" r="16" fill="url(#gold)"/>

  <!-- outer ring -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="url(#gold)" stroke-width="8"/>
</svg>
